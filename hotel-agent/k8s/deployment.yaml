apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-agent
  namespace: a2a-demo
  labels:
    app: hotel-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-agent
  template:
    metadata:
      labels:
        app: hotel-agent
    spec:
      containers:
        - name: hotel-agent
          image: hotel-agent:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PUBLIC_BASE_URL
              value: http://localhost:8081 # as reached via kubectl port-forward
            - name: MCP_SELF_URL
              value: http://localhost:8080/mcp
          envFrom:
            - secretRef:
                name: hotel-agent-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
