# The Secret is created imperatively (do NOT commit real keys):
#
#   kubectl -n a2a-demo create secret generic hotel-agent-secrets \
#     --from-literal=GOOGLE_API_KEY=<your-ai-studio-key>
#
# This file is a placeholder so `kubectl apply -f k8s/` order is documented.
# If the secret already exists, applying this is a no-op error-free courtesy:
apiVersion: v1
kind: Secret
metadata:
  name: hotel-agent-secrets
  namespace: a2a-demo
type: Opaque
stringData:
  # Replaced imperatively; see command above. Placeholder keeps the manifest valid.
  GOOGLE_API_KEY: "REPLACE_ME_VIA_KUBECTL"
