# travel-planner on EKS — mirrors the a2a-token-as deployment pattern
# (same namespace, same hardening, same style), with the planner's own
# surfaces: AG-UI SSE (long-lived), /a2a (planner card), /api (trace +
# profile), and the GAP hybrid env (relationship targets).
#
# Secrets: created out-of-band (see README in this dir) — never committed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2a-travel-planner
  namespace: ping-devops-cprice
  labels:
    app: a2a-travel-planner
spec:
  minReadySeconds: 10
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: a2a-travel-planner
  template:
    metadata:
      labels:
        app: a2a-travel-planner
    spec:
      # No default k8s API token: the only credential the pod needs is the
      # WIF-audience projected token below (aud must match the WIF
      # provider's allowed-audiences — sts.amazonaws.com per Google's EKS
      # federation doc; verify with `gcloud ... providers describe`).
      automountServiceAccountToken: false
      serviceAccountName: travel-planner
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: travel-planner
          image: pricecs/a2a-travel-planner:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            # Model: Gemini Developer API (same key as the local flavor).
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef: { name: a2a-travel-planner-credentials, key: GOOGLE_API_KEY }
            - name: PUBLIC_BASE_URL
              value: https://a2a-travel-planner.ping-devops.com
            # No FLIGHT/HOTEL_AGENT_CARD_URL here: GAP relationships below
            # supersede the self-hosted cards entirely, and the k8s planner
            # has no specialists in-cluster to fetch cards from.
            - name: CORS_ORIGINS
              # UI origin (browser calls planner directly) + local dev UI.
              value: https://a2a-travel-ui.ping-devops.com,http://localhost:5173
            # Identity: planner tenant validates the UI token; specialists
            # receive AS-minted delegation tokens (RFC 8693).
            - name: P1_PLANNER_ISSUER
              valueFrom:
                secretKeyRef: { name: a2a-travel-planner-credentials, key: P1_PLANNER_ISSUER }
            # OIDC gate on the agent surfaces (/agui, /a2a): no anonymous
            # path into the prompt. UI sends the planner-tenant token on
            # every call; card + trace stay public (discovery, observability).
            - name: AUTH_REQUIRED
              value: "true"
            # GAP business relationships (P0-locked audiences)
            - name: GAP_FLIGHT_ENGINE
              value: projects/3682147732/locations/us-west1/reasoningEngines/268377594200588288
            - name: GAP_FLIGHT_AUDIENCE
              value: a2a://flights
            - name: GAP_FLIGHT_SCOPE
              value: a2a:book
            - name: GAP_HOTEL_ENGINE
              value: projects/3682147732/locations/us-west1/reasoningEngines/6963541390240251904
            - name: GAP_HOTEL_AUDIENCE
              value: a2a://hotels
            - name: GAP_HOTEL_SCOPE
              value: a2a:book
            # TokenExchange-AS (all exchanges: delegation + loyalty pulls)
            - name: AS_ISSUER
              value: https://a2a-token-as.ping-devops.com
            - name: AS_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: a2a-travel-planner-credentials, key: AS_CLIENT_ID }
            - name: AS_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: a2a-travel-planner-credentials, key: AS_CLIENT_SECRET }
            # No per-specialist bridge clients: the exchange ACTOR is the
            # planner's own platform identity (the projected k8s SA token
            # at /var/run/secrets/tokens/token, read fresh per exchange).
            # Profile API audience (self-hosted loyalty pull flavor)
            - name: P1_PROFILE_AUDIENCE
              value: planner-profile-api
            # WIF on EKS: no metadata server here, so google.auth needs the
            # credential CONFIG (generated out-of-band via create-cred-config,
            # mounted as a ConfigMap). It reads the projected SA token from
            # /var/run/secrets/tokens/token and exchanges it at STS →
            # impersonated a2a-planner SA token. Not a secret — URLs only.
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /etc/gcp/credential-config.json
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: gcp-cred-config
              mountPath: /etc/gcp
              readOnly: true
            - name: gcp-wif-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
          readinessProbe:
            httpGet: { path: /a2a/.well-known/agent-card.json, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet: { path: /a2a/.well-known/agent-card.json, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          startupProbe:
            httpGet: { path: /a2a/.well-known/agent-card.json, port: http }
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 30
      volumes:
        - name: gcp-cred-config
          configMap:
            name: a2a-travel-planner-wif
        # WIF audience token: `sts.amazonaws.com` must be in the WIF
        # provider's allowed audiences (verify with `gcloud iam
        # workload-identity-pools providers describe a2a-eks-provider
        # --pool=a2a-eks-pool --location=global`). The default SA token
        # (aud = k8s API server) is rejected by STS.
        - name: gcp-wif-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
