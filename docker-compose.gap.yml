# GAP hybrid mode: local planner (this compose) delegating to GAP-deployed
# specialists. Adds the ADC mount the GAP card fetch needs — the local
# stand-in for the WIF credential the k8s deployment gets natively.
# Run:  docker compose -f docker-compose.yml -f docker-compose.gap.yml up -d
services:
  travel-planner:
    volumes:
      - ~/.config/gcloud/application_default_credentials.json:/gac/application_default_credentials.json:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /gac/application_default_credentials.json
