[project]
name = "flight-agent"
version = "0.1.0"
description = "Flight search/booking agent: mock REST API + MCP server + ADK agent served over A2A and AG-UI"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk[a2a]>=2.9,<3",
    "ag-ui-adk>=0.7,<0.8",
    "fastmcp>=2.14,<3",
    "uvicorn>=0.35",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
