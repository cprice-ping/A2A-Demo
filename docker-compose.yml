services:
  flight-agent:
    build: ./flight-agent
    ports: ["8080:8080"]
    environment:
      # Model: Gemini Developer API (static key). The keyless Vertex+ADC path
      # is documented at the bottom of this file for deployments that prefer
      # it; a static key removes the gcloud login / bind-mount staleness
      # failure modes the demo previously hit.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?set GOOGLE_API_KEY in .env or your shell}
      PUBLIC_BASE_URL: http://flight-agent:8080
      MCP_SELF_URL: http://localhost:8080/mcp
      CORS_ORIGINS: http://localhost:5173
      # Identity (PingOne flights tenant)
      P1_FLIGHTS_ISSUER: ${P1_FLIGHTS_ISSUER:-}
      P1_FLIGHTS_AUDIENCE: ${P1_FLIGHTS_AUDIENCE:-http://localhost:8080}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      # Delegated calls: act.sub = the flights a2a-bridge client id
      AUTHORIZED_ACTORS: ${P1_FLIGHTS_BRIDGE_CLIENT_ID:-travel-planner}
      # TokenExchange-AS (all exchanges: delegation + loyalty pull)
      AS_ISSUER: ${AS_ISSUER:-}
      AS_CLIENT_ID: ${AS_CLIENT_ID:-}
      AS_CLIENT_SECRET: ${AS_CLIENT_SECRET:-}
      # Loyalty: person-scoped profile token minted by the AS, then pull
      P1_PLANNER_ISSUER: ${P1_PLANNER_ISSUER:-}
      P1_PLANNER_BRIDGE_CLIENT_ID: ${P1_PLANNER_BRIDGE_CLIENT_ID:-}
      P1_PLANNER_BRIDGE_CLIENT_SECRET: ${P1_PLANNER_BRIDGE_CLIENT_SECRET:-}
      P1_PROFILE_AUDIENCE: ${P1_PROFILE_AUDIENCE:-planner-profile-api}
      P1_PROFILE_SCOPE: ${P1_PROFILE_SCOPE:-loyalty:read}
      PLANNER_PROFILE_URL: http://travel-planner:8080/api/profile/loyalty
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  hotel-agent:
    build: ./hotel-agent
    ports: ["8081:8080"]
    environment:
      # Model: Gemini Developer API (static key) — same as the other two
      # services now, so one key drives all three agents.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?set GOOGLE_API_KEY in .env or your shell}
      PUBLIC_BASE_URL: http://hotel-agent:8080
      MCP_SELF_URL: http://localhost:8080/mcp
      CORS_ORIGINS: http://localhost:5173
      # Identity (PingOne hotels tenant)
      P1_HOTELS_ISSUER: ${P1_HOTELS_ISSUER:-}
      P1_HOTELS_AUDIENCE: ${P1_HOTELS_AUDIENCE:-http://localhost:8081}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      # Delegated calls: act.sub = the hotels a2a-bridge client id
      AUTHORIZED_ACTORS: ${P1_HOTELS_BRIDGE_CLIENT_ID:-travel-planner}
      # TokenExchange-AS (all exchanges: delegation + loyalty pull)
      AS_ISSUER: ${AS_ISSUER:-}
      AS_CLIENT_ID: ${AS_CLIENT_ID:-}
      AS_CLIENT_SECRET: ${AS_CLIENT_SECRET:-}
      # Loyalty: person-scoped profile token minted by the AS, then pull
      P1_PLANNER_ISSUER: ${P1_PLANNER_ISSUER:-}
      P1_PLANNER_BRIDGE_CLIENT_ID: ${P1_PLANNER_BRIDGE_CLIENT_ID:-}
      P1_PLANNER_BRIDGE_CLIENT_SECRET: ${P1_PLANNER_BRIDGE_CLIENT_SECRET:-}
      P1_PROFILE_AUDIENCE: ${P1_PROFILE_AUDIENCE:-planner-profile-api}
      P1_PROFILE_SCOPE: ${P1_PROFILE_SCOPE:-loyalty:read}
      PLANNER_PROFILE_URL: http://travel-planner:8080/api/profile/loyalty
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  travel-planner:
    build: ./travel-planner
    ports: ["8082:8080"]
    environment:
      # Model: Gemini Developer API (static key) — same as the specialists.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?set GOOGLE_API_KEY in .env or your shell}
      PUBLIC_BASE_URL: http://travel-planner:8080
      FLIGHT_AGENT_CARD_URL: http://flight-agent:8080/a2a/.well-known/agent-card.json
      HOTEL_AGENT_CARD_URL: http://hotel-agent:8080/a2a/.well-known/agent-card.json
      CORS_ORIGINS: http://localhost:5173
      # Identity: planner tenant validates the UI token; specialists receive
      # AS-minted delegation tokens via RFC 8693 at the TokenExchange-AS.
      P1_PLANNER_ISSUER: ${P1_PLANNER_ISSUER:-}
      # Audience the AS stamps on person-scoped profile tokens the loyalty
      # endpoint accepts (must match the exchange's audience= parameter).
      P1_PROFILE_AUDIENCE: ${P1_PROFILE_AUDIENCE:-planner-profile-api}
      # TokenExchange-AS (all exchanges: delegation + specialists' loyalty pulls)
      AS_ISSUER: ${AS_ISSUER:-}
      AS_CLIENT_ID: ${AS_CLIENT_ID:-}
      AS_CLIENT_SECRET: ${AS_CLIENT_SECRET:-}
      P1_FLIGHTS_ISSUER: ${P1_FLIGHTS_ISSUER:-}
      P1_FLIGHTS_BRIDGE_CLIENT_ID: ${P1_FLIGHTS_BRIDGE_CLIENT_ID:-}
      P1_FLIGHTS_BRIDGE_CLIENT_SECRET: ${P1_FLIGHTS_BRIDGE_CLIENT_SECRET:-}
      P1_FLIGHTS_AUDIENCE: ${P1_FLIGHTS_AUDIENCE:-http://localhost:8080}
      P1_FLIGHTS_SCOPE: ${P1_FLIGHTS_SCOPE:-a2a:book}
      P1_HOTELS_ISSUER: ${P1_HOTELS_ISSUER:-}
      P1_HOTELS_BRIDGE_CLIENT_ID: ${P1_HOTELS_BRIDGE_CLIENT_ID:-}
      P1_HOTELS_BRIDGE_CLIENT_SECRET: ${P1_HOTELS_BRIDGE_CLIENT_SECRET:-}
      P1_HOTELS_AUDIENCE: ${P1_HOTELS_AUDIENCE:-http://localhost:8081}
      P1_HOTELS_SCOPE: ${P1_HOTELS_SCOPE:-a2a:book}
    depends_on:
      flight-agent:
        condition: service_healthy
      hotel-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/a2a/.well-known/agent-card.json')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

# ---- Alternative model auth: Vertex AI + ADC (keyless) ---------------------
#
# All three services use the Gemini Developer API (GOOGLE_API_KEY) by default.
# For a keyless deployment, replace each service's GOOGLE_API_KEY line with
# this block and re-add the ADC volume mount:
#
#   GOOGLE_GENAI_USE_VERTEXAI: "true"
#   GOOGLE_CLOUD_PROJECT: <project with Vertex AI enabled>
#   GOOGLE_CLOUD_LOCATION: us-central1
#   GOOGLE_APPLICATION_CREDENTIALS: /gac/application_default_credentials.json
#   volumes:
#     - ~/.config/gcloud/application_default_credentials.json:/gac/application_default_credentials.json:ro
#
# Prereq: gcloud auth application-default login. Trade-offs: keyless and
# billed through the project, but the credential is a personal OAuth grant
# that expires (interactive re-login) and goes stale inside containers via
# the bind-mount inode (restart the service after re-login).
