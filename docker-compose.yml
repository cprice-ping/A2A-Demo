services:
  flight-agent:
    build: ./flight-agent
    ports: ["8080:8080"]
    environment:
      # Model via Vertex AI + ADC (keyless). Requires:
      #   gcloud auth application-default login
      #   GOOGLE_CLOUD_PROJECT pointing at a project with Vertex AI enabled
      GOOGLE_GENAI_USE_VERTEXAI: "true"
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      GOOGLE_APPLICATION_CREDENTIALS: /gac/application_default_credentials.json
      PUBLIC_BASE_URL: http://flight-agent:8080
      MCP_SELF_URL: http://localhost:8080/mcp
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ${ADC_FILE:-~/.config/gcloud/application_default_credentials.json}:/gac/application_default_credentials.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  hotel-agent:
    build: ./hotel-agent
    ports: ["8081:8080"]
    environment:
      # The only place a Gemini API key is needed in this demo. To use the
      # keyless Vertex path instead, set the GOOGLE_GENAI_* vars like
      # flight-agent and mount ADC.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?set GOOGLE_API_KEY in .env or your shell}
      PUBLIC_BASE_URL: http://hotel-agent:8080
      MCP_SELF_URL: http://localhost:8080/mcp
      CORS_ORIGINS: http://localhost:5173
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  travel-planner:
    build: ./travel-planner
    ports: ["8082:8080"]
    environment:
      GOOGLE_GENAI_USE_VERTEXAI: "true"
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      GOOGLE_APPLICATION_CREDENTIALS: /gac/application_default_credentials.json
      PUBLIC_BASE_URL: http://travel-planner:8080
      FLIGHT_AGENT_CARD_URL: http://flight-agent:8080/a2a/.well-known/agent-card.json
      HOTEL_AGENT_CARD_URL: http://hotel-agent:8080/a2a/.well-known/agent-card.json
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ${ADC_FILE:-~/.config/gcloud/application_default_credentials.json}:/gac/application_default_credentials.json:ro
    depends_on:
      flight-agent:
        condition: service_healthy
      hotel-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/a2a/.well-known/agent-card.json')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
